[project]
name = "magical-athlete-server"
version = "1.0.0"
description = "Authoritative multiplayer server for Magical Athlete"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "rich>=13.7,<14",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magical_athlete", "src/magsim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
